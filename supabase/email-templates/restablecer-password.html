<!--
  Plantilla del correo "Reset Password" de Supabase Auth (Authentication > Emails > Templates).
  Se pega en el panel de Supabase: este archivo es solo el respaldo.
  Asunto: Restablece tu contraseña de RutNail
  Variable de Supabase: {{ .ConfirmationURL }} (enlace de recuperación).
-->
<div style="background:#0c0b0a;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#141210;border:1px solid #2a2620;border-radius:16px;padding:32px;text-align:center;color:#f3ece0;">
    <h1 style="margin:0 0 8px;font-size:22px;color:#e3c98f;">RutNail</h1>
    <h2 style="margin:0 0 16px;font-size:18px;color:#f3ece0;">Restablece tu contraseña</h2>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#d8d0c2;">
      Recibimos una solicitud para cambiar la contraseña de tu cuenta. Toca el botón para elegir una nueva.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e3c98f;color:#1c1509;text-decoration:none;font-weight:bold;padding:14px 28px;border-radius:12px;">
      Elegir nueva contraseña
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#9c9484;">
      Si no pediste este cambio, ignora este mensaje: tu contraseña seguirá igual. El enlace vence en poco tiempo.
    </p>
  </div>
</div>
